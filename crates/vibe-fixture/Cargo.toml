[package]
name = "vibe-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Scripted fake vibe-app-server for tests and local development"

[dependencies]
vibe-protocol = { path = "../vibe-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "rt-multi-thread", "time"] }
fs2 = "0.4"

[dev-dependencies]
futures = "0.3"
