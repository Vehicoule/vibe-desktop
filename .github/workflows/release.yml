name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version string for artifact names (no release is published)
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-aarch64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libvulkan-dev libudev-dev

      - name: rust toolchain
        run: rustup update stable && rustup default stable

      - name: build
        run: cargo build --release --locked -p vibe-desktop

      # VERSION is passed through the environment, never ${{ }}-interpolated
      # into shell text — a tag name can't inject commands.
      - name: package (linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/package-unix.sh target/release/vibe-desktop linux "$VERSION" "vibe-desktop-${VERSION}-${{ matrix.artifact }}.tar.gz"

      - name: package (macos)
        if: matrix.os == 'macos-latest'
        run: ./scripts/package-unix.sh target/release/vibe-desktop macos "$VERSION" "Vibe Desktop-${VERSION}-${{ matrix.artifact }}.zip"
        # Signing + notarization: add steps here once Apple certs are
        # provisioned (see README → Releasing). Unsigned zip for now.

      - name: package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/vibe-desktop.exe, packaging/icon.png -DestinationPath "vibe-desktop-$env:VERSION-${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibe-desktop-${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: vibe-desktop-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
