name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version string for artifact names (no release is published)
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-aarch64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libvulkan-dev libudev-dev

      - name: rust toolchain
        run: rustup update stable && rustup default stable

      - name: build
        run: cargo build --release --locked -p vibe-desktop

      # VERSION is passed through the environment, never ${{ }}-interpolated
      # into shell text — a tag name can't inject commands.
      # appimagetool is an AppImage itself — the wrapper adds
      # --appimage-extract-and-run, sidestepping the missing FUSE driver
      # on hosted runners (no fuse → plain AppImage exec fails).
      - name: appimagetool
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -fsSL -o appimagetool.bin https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.bin
          printf '#!/bin/sh\nexec "%s/appimagetool.bin" --appimage-extract-and-run "$@"\n' "$PWD" > appimagetool
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: package (linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/package-unix.sh target/release/vibe-desktop linux "$VERSION" "vibe-desktop-${VERSION}-${{ matrix.artifact }}.AppImage"

      - name: package (macos)
        if: matrix.os == 'macos-latest'
        run: ./scripts/package-unix.sh target/release/vibe-desktop macos "$VERSION" "Vibe Desktop-${VERSION}-${{ matrix.artifact }}.zip"
        # Signing + notarization: add steps here once Apple certs are
        # provisioned (see README → Releasing). Unsigned zip for now.

      - name: package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          makensis /DVERSION="$env:VERSION" packaging\vibe-desktop.nsi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibe-desktop-${{ matrix.artifact }}
          path: |
            *.AppImage
            *.zip
            *.exe
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: vibe-desktop-*
          merge-multiple: true
          path: dist

      # GHA expressions have no split(), so parse the tag in shell —
      # ref name arrives via env, never ${{ }}-interpolated into run text.
      # Semver prerelease suffix (v0.1.0-alpha) → prerelease; only the
      # part before '+' counts since build metadata may hold hyphens.
      - id: pre
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          core="${REF_NAME%%+*}"
          case "$core" in
            *-*) echo "flag=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "flag=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.pre.outputs.flag }}
